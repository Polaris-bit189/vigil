# VIGIL 监视人物名单
#
# ⚠️ **本文件是示例数据**——uin 与 label 都是编的。
#
# ── 怎么加人 ─────────────────────────────────────────────
#   1. 在前端「按人物筛选」里添加，或手工往下面追加一段 [[persons]]
#   2. uin 是 QQ 号。不要填 0（那是匿名哨兵）。
#   3. 本文件由程序原子写出；手工改也行，下次保存会整体覆盖。
#
# label 是你自己起的名字（不是群昵称快照）——群昵称会变，label 不会。

[[persons]]
uin = 10001
label = "示例·班主任"
note = "示例数据，请替换为你真正想盯的人"

[[persons]]
uin = 10002
label = "示例·班委"
note = "示例数据，请替换为你真正想盯的人"
