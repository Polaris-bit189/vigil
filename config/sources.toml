# VIGIL 网页通知源配置
#
# 每个 [[sources]] 段 = 一个通知源 = 下游视角里的一个「群」。
# 加一个部门/学院的通知页 = 加一段，**不用改代码**。
#
# ⚠️ **只配公开页面。** 不要配需要登录的地址（一网通办 / OA / 教务系统）——
#    那是"用你的身份进学校设防的系统"，与"读学校公开的信息"是两件事，
#    而且评委复现不了。
#
# ── 字段 ─────────────────────────────────────────────────────
#   name  源名（会显示在界面上，写成"部门·栏目"最清楚）
#   url   列表页地址
#   list  每一条通知所在的行
#   title 行内取标题的元素（**优先取 title 属性**——它比显示文本完整）
#   date  行内取日期的元素
#   link  行内取链接，写成 `元素@属性`
#   max_pages  可选，翻页上限（默认 1 = 只抓首页）
#
# ── 选择器支持范围（刻意做小）─────────────────────────────────
#   只支持 `标签名`、`标签名.class`、`元素@属性` 三种。
#   ⚠️ 不做完整 CSS：自己写选择器引擎是另一个量级的工作，
#      而高校用的**网站群系统是同形的**，简单的够了。
#
# ── 怎么加一个新源 ───────────────────────────────────────────
#   1. 浏览器打开目标通知页，F12 看一条通知的 HTML 结构
#   2. 照着下面填四个选择器
#   3. `python -m vigil web check` 验证能解析出条目（解析出 0 条会响亮报错）
#
# ⚠️ 抓不到时**会抛异常而不是返回空** —— 站点改版导致选择器失效时，
#    你会看到明确的报错，而不是"这个源本来就没内容"。

# ── 已实测的源（2026-10-16）──────────────────────────────────
#
# ⚠️ 这里配的是**吉林大学本科生院**的通知页。换成你自己学校的：
#    多数高校用同一套网站群系统，URL 与选择器往往直接能用。
#    实测：https://jwc.jlu.edu.cn/zxzx/tzgg.htm
#    结构：<li><span>2026-09-15</span><a href="../info/1050/12635.htm">标题</a></li>

[[sources]]
name = "吉林大学本科生院·通知公告"
url = "https://jwc.jlu.edu.cn/zxzx/tzgg.htm"
list = "li"
title = "a"
date = "span"
link = "a@href"
max_pages = 1
