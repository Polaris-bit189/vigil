# VIGIL 群配置
#
# ⚠️ **本文件是示例配置**——群号与群名都是编的（9000000xx 段）。
#    真实部署时用网页「配置」页或编辑本文件灌入你自己的群。
#
# ── 数据源 ─────────────────────────────────────────────────
#   source = "synthetic"  ← **默认**。离线合成语料，无需任何外部依赖，
#                            一条 `vigil demo` 就有数据。适合演示与复现。
#   source = "qq"         ← 读本机 QQ 加密库。**需要私有模块 qq_source.py**
#                           （不随开源版本分发）与 VIGIL_DB_KEY 密钥。
#
# source_dir 的含义随 source 变：synthetic 不用它（占位即可），
# qq 源用它定位 nt_msg.db 所在的目录。
#
# ── 怎么加群 ───────────────────────────────────────────────
#   1. 跑 `vigil groups`，它会列出数据源里所有群
#      （含群号、群名、消息数，以及「是否已纳入」）
#   2. 把新群的 id 按下面格式加一段 [[groups]]
#   3. 重跑 `vigil ingest`。**每次都是全量重读所有已纳群**（不做增量记账），
#      写入用 INSERT OR REPLACE，所以重跑不会产生重复行。
#
# ── 怎么退群 ───────────────────────────────────────────────
#   把 enabled 改成 false（保留配置便于回看），或整段删掉。
#   已摄取的历史数据留在库里不动——那是你的记录。
#
# ⚠️ **本文件由程序整体重写**（网页「配置」页保存时会覆盖它）：
#    手工改也行，但**手工加的注释会在下一次网页保存时消失**。


[settings]
# 数据源目录。synthetic 源不用它；qq 源用它定位库文件。
# ⚠️ 旧名是 `qq_db_dir`——读侧仍接受并会出声警告，保存时会自动改成新名。
source_dir = "data"
output_db = "data/vigil.db"
source = "synthetic"

# ── 示例群 ────────────────────────────────────────────────
# tier 的语义：high = 每条都要看（班级群 / 官方通知），
#              normal = 过关键词筛（兴趣群 / 二手群）。
#
# ⚠️ 下面四个群号与 demo/corpus.toml 里的合成语料**一一对应** ——
#    改这里就要改那里，否则 `vigil groups` 会报「已纳入但库里没有消息」。

[[groups]]
id = 900000001
name = "示例·年级通知群"
enabled = true
tier = "high"

[[groups]]
id = 900000002
name = "示例·班级群"
enabled = true
tier = "high"

[[groups]]
id = 900000003
name = "示例·社团活动群"
enabled = true
tier = "normal"

[[groups]]
id = 900000004
name = "示例·二手交易群"
enabled = true
tier = "normal"
